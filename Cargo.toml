[package]
name = "reprodb"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Local CLI for reproducing Salt tenant databases"
license = "Proprietary"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
fs4 = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = "thin"
