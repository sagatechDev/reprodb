[package]
name = "reprodb"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Local CLI for reproducing Salt tenant databases"
license = "Proprietary"

[features]
default = []
# CI-only plaintext credential persistence inside an isolated REPRODB_HOME.
# Normal developer and release builds do not compile this backend.
test-file-credential-store = []

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
directories = "6"
dialoguer = { version = "0.12", default-features = false }
rpassword = "7.5"
fs4 = "1"
keyring = "4"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = "thin"
